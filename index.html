            <div class="content-container" id="contentContainer">

        </main>

                </div>
                <div class="chart-container">
                    <canvas id="equityChart" width="400" height="200"></canvas>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Monthly Performance</h2>
                </div>
                <div class="chart-container">
                    <canvas id="monthlyChart" width="400" height="200"></canvas>
                </div>
            </section>
        </div>
    </template>

    <template id="risk-page">
        <div class="page-content risk-page">
            <section class="section">
                <div class="section-header">
                    <h2>Risk Management</h2>
                </div>
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-label">Risk per Trade</div>
                        <div class="metric-value">$500.00</div>
                        <div class="metric-change positive">2% of account</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Max Concurrent</div>
                        <div class="metric-value">3 / 5</div>
                        <div class="metric-change neutral">Positions allowed</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Daily Loss Limit</div>
                        <div class="metric-value">$2,000.00</div>
                        <div class="metric-change positive">Not exceeded</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">Current Exposure</div>
                        <div class="metric-value">$21,427.50</div>
                        <div class="metric-change neutral">42.85% of equity</div>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Risk Parameters</h2>
                </div>
                <div class="risk-parameters">
                    <div class="parameter-item">
                        <div class="parameter-label">Risk/Reward Ratio</div>
                        <div class="parameter-value">Minimum 1:1.5</div>
                        <div class="parameter-status success">Enforced</div>
                    </div>
                    <div class="parameter-item">
                        <div class="parameter-label">Stop Loss</div>
                        <div class="parameter-value">Always set</div>
                        <div class="parameter-status success">Enforced</div>
                    </div>
                    <div class="parameter-item">
                        <div class="parameter-label">Position Sizing</div>
                        <div class="parameter-value">Auto-calculated</div>
                        <div class="parameter-status success">Active</div>
                    </div>
                    <div class="parameter-item">
                        <div class="parameter-label">Drawdown Protection</div>
                        <div class="parameter-value">15% max daily</div>
                        <div class="parameter-status success">Active</div>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <template id="account-page">
        <div class="page-content account-page">
            <section class="section">
                <div class="section-header">
                    <h2>Account Information</h2>
                </div>
                <div class="account-info">
                    <div class="account-card">
                        <div class="account-field">
                            <span class="account-label">Exchange</span>
                            <span class="account-value">Bybit</span>
                        </div>
                        <div class="account-field">
                            <span class="account-label">Connection Status</span>
                            <span class="account-value">
                                <span class="badge badge-success">
                                    <i class="fas fa-check-circle"></i> Connected
                                </span>
                            </span>
                        </div>
                        <div class="account-field">
                            <span class="account-label">Environment</span>
                            <span class="account-value">Demo Trading</span>
                        </div>
                        <div class="account-field">
                            <span class="account-label">Account Equity</span>
                            <span class="account-value">$50,000.00</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Exchange Connection</h2>
                </div>
                <div class="connection-section">
                    <p class="section-description">
                        Connect your Bybit account to start live trading. Your API keys are encrypted and stored securely.
                    </p>
                    <button class="btn btn-primary" id="connectBtn">
                        <i class="fas fa-link"></i> Connect Exchange
                    </button>
                </div>
            </section>

            <section class="section">
                <div class="section-header">
                    <h2>Settings</h2>
                </div>
                <div class="settings-list">
                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">Demo Trading Mode</div>
                            <div class="setting-description">Trade on Bybit Demo account without real money</div>
                        </div>
                        <div class="setting-control">
                            <label class="toggle">
                                <input type="checkbox" checked>
                                <span class="toggle-switch"></span>
                            </label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">Auto-Trade</div>
                            <div class="setting-description">Automatically place orders when setups are activated</div>
                        </div>
                        <div class="setting-control">
                            <label class="toggle">
                                <input type="checkbox" checked>
                                <span class="toggle-switch"></span>
                            </label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <div class="setting-info">
                            <div class="setting-title">Email Notifications</div>
                            <div class="setting-description">Receive alerts for setup updates and filled orders</div>
                        </div>
                        <div class="setting-control">
                            <label class="toggle">
                                <input type="checkbox">
                                <span class="toggle-switch"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
